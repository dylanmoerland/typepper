[package]
name = "typepper-server"
version = "0.1.0"
edition = "2024"
description = "typepper's server: leaderboards, accounts and shareable replays"
license = "GPL-3.0-or-later"
repository = "https://github.com/leodiegues/typepper"
publish = false

# deployed to Railway (see infra/), not released with the game
[package.metadata.dist]
dist = false

[package.metadata.release]
release = false

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
russh = { version = "0.64.1", default-features = false, features = ["ring", "rsa"] }
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
