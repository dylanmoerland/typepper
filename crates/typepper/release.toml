# cargo-release: `cargo release <patch|minor|major> --execute` bumps the
# version, dates the changelog, commits, tags vX.Y.Z and pushes. The tag
# starts the release (cargo-dist) and the site deploy (pages.yml).
allow-branch = ["main"]
publish = false # not on crates.io (yet)
tag-name = "v{{version}}"
tag-message = "typepper {{version}}"
pre-release-commit-message = "Release v{{version}}"
push-remote = "origin"
pre-release-replacements = [
  # the notes written under "Unreleased" become this version's section, which
  # cargo-dist also uses as the GitHub release notes
  { file = "../../CHANGELOG.md", search = "## Unreleased", replace = "## Unreleased\n\n## [{{version}}] - {{date}}", exactly = 1 },
]
