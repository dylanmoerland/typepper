[package]
name = "typepper"
version = "0.1.0"
edition = "2024"

[dependencies]
rand = "0.10.3"
ratatui = { version = "0.30.2", default-features = false, features = ["std", "layout-cache"] }
web-time = "1.1.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ratatui = { version = "0.30.2", features = ["crossterm"] }
terminal-colorsaurus = "1.0.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
ratzilla = "0.3.1"
getrandom = { version = "0.4", features = ["wasm_js"] }
web-sys = { version = "0.3", features = ["CssStyleDeclaration", "MediaQueryList"] }
