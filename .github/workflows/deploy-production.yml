# Deploys typepper-server to Railway: applies infra/railway/railway.ts, then
# uploads this commit for Railway to build (infra/docker). Detached: green
# means Railway took the commit; it switches traffic once /health answers, and
# a failed build or health check leaves the previous deploy serving.
name: deploy-production

on:
  push:
    branches: [main]
    paths:
      - crates/typepper-server/**
      - crates/typepper-engine/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - infra/**
      - .github/workflows/deploy-production.yml
  workflow_dispatch:

permissions:
  contents: read

# one deploy at a time; never cancel one halfway through an apply
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - run: rustup toolchain install # the one in rust-toolchain.toml
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: server
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy -p typepper-server --all-targets --locked -- -D warnings
      - run: cargo test -p typepper-server --locked

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment: Production
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY: infra/railway/node_modules/.bin/railway
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: infra/railway/.nvmrc
          cache: npm
          cache-dependency-path: infra/railway/package-lock.json
      - run: npm ci --prefix infra/railway
      # --yes without --confirm-destructive: an apply that would delete
      # anything (the TCP proxy's port is in released games) fails instead
      - run: $RAILWAY config apply --file infra/railway/railway.ts --yes
      - run: $RAILWAY up --detach --service typepper-server
